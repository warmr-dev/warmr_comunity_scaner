# Warmr community scanner — bundled SearXNG settings

use_default_settings: true

server:
  secret_key: "warmr-scanner-change-in-production"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: bing
    disabled: false
