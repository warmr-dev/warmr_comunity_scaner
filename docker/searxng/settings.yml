# Warmr community scanner — bundled SearXNG settings (USA)

use_default_settings: true

general:
  debug: false
  instance_name: "warmr-scanner"

server:
  secret_key: "warmr-scanner-change-in-production"
  limiter: false
  image_proxy: false
  bind_address: "127.0.0.1"
  port: 8080

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en-US"
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: bing
    disabled: false
    weight: 1.5
  - name: yahoo
    disabled: false
    weight: 1.0
  - name: wikipedia
    disabled: true
  - name: mojeek
    disabled: true
  - name: startpage
    disabled: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: " WarmrScanner/0.1"
