services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
      POSTGRES_DB: community_scanner
    ports:
      - "5432:5432"
    volumes:
      - scanner_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d community_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/

  scanner:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      APP_ENV: local
      DATABASE_URL: sqlite:///./data/scanner.db
      REDIS_URL: redis://redis:6379/0
      USE_FETCH_QUEUE: "true"
      DISCOVERY_PROVIDERS: directory,searxng
      SEARXNG_BASE_URL: http://searxng:8080
      DISCOVERY_CONCURRENCY: 1
      DIRECTORY_MAX_CHANNELS_PER_SITE: 40
      SCANNER_MODE: full
      FETCH_CONCURRENCY: 50
      FETCH_BATCH_SIZE: 200
      WORKER_MAX_ITEMS: 1000
      PIPE_NICHE: business
      PIPE_GEO: USA
      SEARXNG_LANGUAGE: en-US
      PIPE_QUERIES: 5
      PIPE_PER_QUERY: 15
      CRAWL_DOWNLOAD_DELAY_SECONDS: "0.6"
    volumes:
      - ./data:/app/data

  scanner-worker:
    build: .
    profiles: ["worker"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: sqlite:///./data/scanner.db
      REDIS_URL: redis://redis:6379/0
      USE_FETCH_QUEUE: "true"
      SCANNER_MODE: worker
      FETCH_CONCURRENCY: 20
      WORKER_MAX_ITEMS: 10000
    volumes:
      - ./data:/app/data

volumes:
  scanner_pg:
