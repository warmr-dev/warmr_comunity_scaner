<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Scanner</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#131b31; --line:#263354; --muted:#8d9ab8; --text:#edf2ff; --accent:#8f7cff; --green:#57d6a0; }
    * { box-sizing:border-box; } body { margin:0; background:linear-gradient(135deg,#0b1020,#101a35); color:var(--text); font:14px/1.45 Inter,system-ui,sans-serif; }
    .wrap { max-width:1440px; margin:auto; padding:32px 24px 56px; } header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:28px; }
    h1 { margin:0 0 5px; font-size:30px; letter-spacing:-.04em; } .sub,.muted { color:var(--muted); } button,select,input { background:#0e162a; color:var(--text); border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
    button { cursor:pointer; background:var(--accent); border:0; font-weight:700; } button.secondary { background:#1d2948; } .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
    .card,.panel { background:rgba(19,27,49,.9); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 12px 30px #05091455; } .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; } .number { font-size:28px; font-weight:800; margin-top:5px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; } input[type=search] { flex:1; min-width:220px; } .layout { display:grid; grid-template-columns:220px 1fr; gap:16px; }
    .platforms { display:flex; flex-direction:column; gap:7px; margin-top:14px; } .platforms button { text-align:left; background:#172342; font-weight:500; } .platforms button.active { background:var(--accent); }
    .table-wrap { overflow:auto; } table { width:100%; border-collapse:collapse; min-width:850px; } th,td { text-align:left; padding:13px 10px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); font-size:11px; text-transform:uppercase; }
    a { color:#b6adff; text-decoration:none; } a:hover { text-decoration:underline; } .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#25345a; font-size:12px; } .high { color:var(--green); background:#123d38; } .empty { text-align:center; padding:40px; color:var(--muted); }
    .footer { display:flex; justify-content:space-between; align-items:center; margin-top:16px; } body:not(.authenticated) main { display:none; } .login { min-height:100vh; display:grid; place-items:center; padding:24px; } body.authenticated .login { display:none; } .login-card { width:min(400px,100%); background:rgba(19,27,49,.96); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 20px 60px #05091488; } .login-card h1 { font-size:24px; margin-bottom:8px; } .login-card form { display:grid; gap:12px; margin-top:22px; } .login-card input { width:100%; } .error { color:#ff8f9d; min-height:20px; } @media(max-width:800px){ .cards{grid-template-columns:repeat(2,1fr)} .layout{grid-template-columns:1fr} header{display:block} header button{margin-top:14px} }
  </style>
</head>
<body>
<section class="login"><div class="login-card"><h1>Community Scanner</h1><div class="sub">Sign in to view communities</div><form onsubmit="login(event)"><input id="email" type="email" autocomplete="username" placeholder="Email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><div class="error" id="loginError"></div><button type="submit">Sign in</button></form></div></section>
<main class="wrap">
  <header><div><h1>Community Scanner</h1><div class="sub">Live read-only view of community_scanner</div></div><button onclick="loadAll()">Refresh data</button></header>
  <section class="cards">
    <div class="card"><div class="label">Total communities</div><div class="number" id="total">—</div></div>
    <div class="card"><div class="label">Free or unknown price</div><div class="number" id="free">—</div></div>
    <div class="card"><div class="label">Platforms</div><div class="number" id="platformCount">—</div></div>
    <div class="card"><div class="label">Current filter</div><div class="number" id="filterLabel">All</div></div>
  </section>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search name, niche, or website…" oninput="debouncedLoad()">
    <select id="tier" onchange="loadCommunities()"><option value="">All tiers</option><option>high</option><option>medium</option><option>low</option><option>junk</option></select>
    <select id="access" onchange="loadCommunities()"><option value="">All access statuses</option><option>join</option><option>apply</option><option>watch</option><option>reject</option></select>
  </div>
  <section class="layout">
    <aside class="panel"><div class="label">Platforms</div><div id="platforms" class="platforms"></div></aside>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>Community</th><th>Platform</th><th>Niche</th><th>Access</th><th>Members</th><th>Price</th><th>Score</th></tr></thead><tbody id="rows"></tbody></table></div><div class="footer"><span class="muted" id="shown"></span><div><button class="secondary" onclick="page(-1)">Previous</button> <button class="secondary" onclick="page(1)">Next</button></div></div></section>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  let supabaseClient;
  let selectedPlatform = "", offset = 0, timer;
  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  async function get(url) { const {data} = await supabaseClient.auth.getSession(); const headers = data.session ? {Authorization:`Bearer ${data.session.access_token}`} : {}; const response = await fetch(url, {headers}); if (!response.ok) throw Error("Request failed"); return response.json(); }
  async function loadStats() {
    const data = await get("/api/stats"); document.querySelector("#total").textContent = data.total.toLocaleString();
    document.querySelector("#free").textContent = data.free_or_unknown.toLocaleString(); document.querySelector("#platformCount").textContent = data.platforms.length;
    document.querySelector("#platforms").innerHTML = `<button class="${selectedPlatform ? "" : "active"}" onclick="choosePlatform('')">All platforms <span class="muted">(${data.total})</span></button>` + data.platforms.map(p => `<button class="${selectedPlatform===p.platform ? "active":""}" onclick="choosePlatform('${esc(p.platform)}')">${esc(p.platform)} <span class="muted">(${p.count})</span></button>`).join("");
  }
  async function loadCommunities() {
    const params = new URLSearchParams({limit:50,offset,search:document.querySelector("#search").value,platform:selectedPlatform,value_tier:document.querySelector("#tier").value,access_status:document.querySelector("#access").value});
    const data = await get("/api/communities?" + params); document.querySelector("#filterLabel").textContent = selectedPlatform || "All";
    document.querySelector("#shown").textContent = `${offset + 1}–${Math.min(offset + data.items.length, data.total)} of ${data.total.toLocaleString()}`;
    document.querySelector("#rows").innerHTML = data.items.length ? data.items.map(item => `<tr><td><strong>${esc(item.name || "Unnamed community")}</strong><br><a href="${esc(item.join_url || item.website)}" target="_blank" rel="noreferrer">${esc(item.join_url || item.website)}</a></td><td><span class="badge">${esc(item.platform)}</span></td><td>${esc(item.niche || "—")}</td><td>${esc(item.access_status || "—")}</td><td>${item.size_members?.toLocaleString() || "—"}</td><td>${esc(item.price_text || (item.price_amount ? `${item.price_amount} ${item.currency || ""}` : "Free / unknown"))}</td><td><span class="badge ${item.value_tier === "high" ? "high" : ""}">${item.value_score ?? 0} · ${esc(item.value_tier)}</span></td></tr>`).join("") : `<tr><td class="empty" colspan="7">No communities found</td></tr>`;
  }
  function choosePlatform(value) { selectedPlatform=value; offset=0; loadAll(); } function page(delta) { offset=Math.max(0,offset + delta*50); loadCommunities(); }
  function debouncedLoad() { clearTimeout(timer); timer=setTimeout(() => { offset=0; loadCommunities(); }, 250); } async function loadAll() { try { await loadStats(); await loadCommunities(); } catch (error) { document.querySelector("#rows").innerHTML=`<tr><td class="empty" colspan="7">Could not connect to the database API</td></tr>`; } }
  async function login(event) { event.preventDefault(); const {error} = await supabaseClient.auth.signInWithPassword({email:document.querySelector("#email").value,password:document.querySelector("#password").value}); if (error) { document.querySelector("#loginError").textContent = "Invalid email or password"; return; } document.body.classList.add("authenticated"); loadAll(); }
  async function startApp() { try { const response = await fetch("/api/config"); const config = await response.json(); if (!response.ok) throw Error(config.error); supabaseClient = window.supabase.createClient(config.url, config.key); const {data} = await supabaseClient.auth.getSession(); if (data.session) { document.body.classList.add("authenticated"); loadAll(); } } catch (error) { document.querySelector("#loginError").textContent = "Authentication is not configured"; } }
  startApp();
</script>
</body>
</html>
