[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-scanner"
version = "0.1.0"
description = "Warmr community discovery and enrichment pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "tenacity>=8.3",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "scrapy>=2.11",
  "redis>=5.0",
  "arq>=0.26",
  "openai>=1.40",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45",
  "scrapy-playwright>=0.0.34",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
community-scanner = "community_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/community_scanner"]

[tool.hatch.build.targets.wheel.force-include]
"src/community_scanner" = "community_scanner"

# Ensure editable installs resolve from src/
[tool.hatch.build.targets.editable]
# hatchling default


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
